services:
  talaqqi-ai-server:
    build: .
    container_name: talaqqi_ai_server
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/root/.cache/huggingface
      - MAX_CONCURRENT_WS=10
    volumes:
      # Hapus bind mount `.:/app` di production (overhead filesystem)
      # - .:/app
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3800M
        reservations:
          cpus: '1.0'
          memory: 2000M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hf_cache:
